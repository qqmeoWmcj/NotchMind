<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台</title>
<style>
:root { --bg:#FFFFFF; --bg-subtle:#F7F7F7; --fg:#111111; --fg-muted:#666666; --border:#E5E5E5; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body {
  background:var(--bg-subtle); color:var(--fg); font-size:14px; line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.shell { width:100%; max-width:880px; margin:0 auto; padding:16px; }
.header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:nowrap; min-width:0; }
h1 { font-size:20px; font-weight:600; color:var(--fg); line-height:1.3; white-space:nowrap; }
.sync-meta { font-size:12px; color:var(--fg-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:65%; text-align:right; }
.toolbar, .capture-bar, .card-actions { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.toolbar, .capture-bar { margin-bottom:12px; }
.btn {
  appearance:none; background:var(--bg); color:var(--fg); border:1px solid var(--border);
  border-radius:6px; padding:6px 12px; font-size:14px; line-height:1.4; cursor:pointer; white-space:nowrap;
}
.btn:hover { background:var(--bg-subtle); }
.btn:disabled { color:var(--fg-muted); cursor:default; }
.btn-active, .btn-active:hover { background:var(--fg); color:var(--bg); border-color:var(--fg); }
.btn-sm { padding:4px 10px; font-size:12px; }
.model-group {
  display:inline-flex; align-items:center; gap:4px; background:var(--bg);
  border:1px solid var(--border); border-radius:6px; padding:3px 6px;
}
.model-label { font-size:12px; color:var(--fg-muted); padding:0 4px; }
.model-opt {
  appearance:none; background:var(--bg); color:var(--fg-muted); border:1px solid var(--bg);
  border-radius:6px; padding:2px 8px; font-size:12px; cursor:pointer;
}
.model-opt:hover { background:var(--bg-subtle); color:var(--fg); }
.model-opt.is-selected { background:var(--fg); color:var(--bg); border-color:var(--fg); }
.capture-input {
  flex:1 1 220px; min-width:0; background:var(--bg); color:var(--fg); border:1px solid var(--border);
  border-radius:6px; padding:7px 10px; font-size:14px; line-height:1.4; outline:none;
}
.capture-input:focus { border-color:var(--fg); }
.capture-input::placeholder { color:var(--fg-muted); }
.notice { font-size:12px; color:var(--fg-muted); margin-bottom:10px; }
.notice:empty { display:none; }
.tabs { display:flex; flex-wrap:wrap; gap:4px 16px; border-bottom:1px solid var(--border); margin-bottom:14px; }
.tab {
  appearance:none; background:transparent; color:var(--fg-muted); border:none;
  border-bottom:2px solid transparent; padding:8px 0; font-size:14px; cursor:pointer; margin-bottom:-1px;
}
.tab:hover { color:var(--fg); }
.tab.is-active { color:var(--fg); font-weight:600; border-bottom-color:var(--fg); }
.list { display:flex; flex-direction:column; gap:10px; }
.card, .project-card { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:14px; min-width:0; overflow-wrap:anywhere; }
.card-meta { font-size:12px; color:var(--fg-muted); margin-bottom:6px; word-break:break-word; }
.card-title, .project-name { font-size:16px; font-weight:600; color:var(--fg); line-height:1.4; margin-bottom:8px; word-break:break-word; }
.card-title a { color:var(--fg); text-decoration:none; }
.card-title a:hover { text-decoration:underline; }
.card-essence, .block-text, .insight-body, .project-summary, .ladder-item-text {
  font-size:14px; color:var(--fg); white-space:pre-wrap; word-break:break-word;
}
.card-essence, .project-summary { margin-bottom:10px; }
.apply-block { border-top:1px solid var(--border); padding-top:8px; margin-bottom:10px; }
.block-label { font-size:12px; color:var(--fg-muted); margin-bottom:4px; }
.insight-details { margin-bottom:10px; }
.insight-details summary { font-size:12px; color:var(--fg-muted); cursor:pointer; list-style:none; }
.insight-details summary::-webkit-details-marker { display:none; }
.insight-body { margin-top:6px; }
.ladder-section { border-top:1px solid var(--border); padding-top:10px; margin-top:10px; }
.ladder-title { font-size:14px; font-weight:600; color:var(--fg); margin-bottom:8px; }
.ladder-item { padding:8px 0; border-top:1px solid var(--border); }
.ladder-item:first-of-type { border-top:none; padding-top:0; }
.ladder-item-title { font-size:14px; font-weight:600; color:var(--fg); margin-bottom:4px; }
.ladder-item-text { margin-bottom:6px; }
.empty { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:20px 14px; font-size:14px; color:var(--fg-muted); }
.empty-inline { font-size:12px; color:var(--fg-muted); }
@media (max-width:520px) { .shell { padding:12px; } .btn { padding:6px 10px; } .capture-input { flex:1 1 100%; width:100%; } }
</style>
</head>
<body>
<div class="shell">
  <header class="header">
    <h1>工作台</h1>
    <div id="syncMeta" class="sync-meta">就绪</div>
  </header>

  <section class="toolbar" aria-label="快捷操作">
    <button id="btnSync" class="btn" type="button">抓今日热点</button>
    <button id="btnClipboard" class="btn" type="button">剪贴板监测: 关</button>
    <button id="btnCompanion" class="btn" type="button">伴随同看: 关</button>
    <div class="model-group" role="group" aria-label="模型切换">
      <span class="model-label">模型</span>
      <button class="model-opt" type="button" data-model="4h">4h</button>
      <button class="model-opt" type="button" data-model="3.8f">3.8f</button>
      <button class="model-opt" type="button" data-model="4a">4a</button>
    </div>
  </section>

  <section class="capture-bar" aria-label="快速输入">
    <input id="quickInput" class="capture-input" type="text" placeholder="输入链接、文字笔记，或新项目想法（项目名：一句话目标）" autocomplete="off">
    <button id="btnCreateProject" class="btn" type="button">记为项目想法</button>
    <button id="btnCaptureUrl" class="btn" type="button">拆解链接</button>
  </section>

  <div id="notice" class="notice" role="status" aria-live="polite"></div>

  <nav class="tabs" id="tabs" aria-label="分类导航">
    <button class="tab is-active" type="button" data-tab="all">全部速览</button>
    <button class="tab" type="button" data-tab="projects">项目孵化池</button>
    <button class="tab" type="button" data-tab="01-LLM与新模型">LLM与新模型</button>
    <button class="tab" type="button" data-tab="02-AI学习与教程">AI学习与教程</button>
    <button class="tab" type="button" data-tab="03-AI创作与3D工具">AI创作与3D工具</button>
    <button class="tab" type="button" data-tab="04-行业深度认知">行业深度认知</button>
  </nav>

  <main id="content" class="list"></main>
</div>

<script>
const state = {
  activeTab: "all",
  data: {
    model: "4h", model_full: "",
    clipboard_watcher: { running: false },
    live_companion: { running: false },
    last_sync_status: { running: false, message: "就绪" },
    projects: [], entries: []
  }
};
const LADDERS = [
  { key: "L1", fullKey: "L1基础教程", label: "L1 基础教程与认知" },
  { key: "L2", fullKey: "L2工具与AI联动", label: "L2 工具与AI联动" },
  { key: "L3", fullKey: "L3一站式自动化", label: "L3 一站式自动化闭环" }
];

const setNotice = (t) => { document.getElementById("notice").textContent = t || ""; };
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
};

async function api(path, options) {
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("请求失败: " + res.status));
  return data;
}

async function copyText(text, btn) {
  const content = (text || "").trim();
  if (!content) { setNotice("当前条目没有可复制的内容"); return; }
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(content);
      ok = true;
    }
  } catch (_) {}
  if (!ok) {
    const area = document.createElement("textarea");
    area.value = content;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.left = "-9999px";
    document.body.appendChild(area);
    area.select();
    try { ok = document.execCommand("copy"); } catch (_) {}
    document.body.removeChild(area);
  }
  if (ok && btn) {
    const prev = btn.dataset.label || btn.textContent;
    btn.dataset.label = prev;
    btn.textContent = "已复制";
    clearTimeout(btn._copyTimer);
    btn._copyTimer = setTimeout(() => { btn.textContent = prev; }, 1400);
  }
}

function makeCopyActions(essenceText, applyText) {
  const row = el("div", "card-actions");
  const b1 = el("button", "btn btn-sm", "复制结论");
  b1.type = "button";
  b1.addEventListener("click", () => copyText(essenceText, b1));
  const b2 = el("button", "btn btn-sm", "复制怎么用");
  b2.type = "button";
  b2.addEventListener("click", () => copyText(applyText || essenceText, b2));
  row.append(b1, b2);
  return row;
}

function formatMeta(entry) {
  const parts = [];
  if (entry.domain) parts.push(entry.domain);
  if (entry.ladder_level) parts.push(entry.ladder_level);
  if (entry.matched_project) parts.push("项目: " + entry.matched_project);
  if (entry.source) parts.push(entry.source);
  if (entry.created_at) parts.push(String(entry.created_at).slice(0, 16).replace("T", " "));
  return parts.join(" / ");
}

function renderEntryCard(entry) {
  const card = el("article", "card");
  card.appendChild(el("div", "card-meta", formatMeta(entry)));
  const titleEl = el("h2", "card-title");
  const titleText = entry.title || "未命名条目";
  if (entry.url && /^https?:\/\//i.test(entry.url)) {
    const a = el("a", "", titleText);
    a.href = entry.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    titleEl.appendChild(a);
  } else {
    titleEl.textContent = titleText;
  }
  card.appendChild(titleEl);
  if (entry.one_line_essence) card.appendChild(el("div", "card-essence", entry.one_line_essence));
  if (entry.how_to_apply) {
    const apply = el("div", "apply-block");
    apply.append(el("div", "block-label", "怎么用"), el("div", "block-text", entry.how_to_apply));
    card.appendChild(apply);
  }
  if (entry.deep_insight) {
    const details = el("details", "insight-details");
    details.append(el("summary", "", "展开深度认知"), el("div", "insight-body", entry.deep_insight));
    card.appendChild(details);
  }
  card.appendChild(makeCopyActions(entry.one_line_essence || titleText, entry.how_to_apply));
  return card;
}

function renderProjectsView() {
  const box = document.getElementById("content");
  box.innerHTML = "";
  const projects = state.data.projects || [];
  const entries = state.data.entries || [];
  if (!projects.length) {
    box.appendChild(el("div", "empty", "暂无项目想法，可在上方输入后点击「记为项目想法」。"));
    return;
  }
  projects.forEach((proj) => {
    const card = el("article", "project-card");
    const name = proj.name || "未命名项目";
    card.appendChild(el("h2", "project-name", name));
    if (proj.idea_summary) card.appendChild(el("div", "project-summary", "目标：" + proj.idea_summary));
    const fallback = entries.filter((e) => e.matched_project === name);
    LADDERS.forEach((ladder) => {
      const sec = el("section", "ladder-section");
      sec.appendChild(el("h3", "ladder-title", ladder.label));
      const fromLadder = proj.ladder && Array.isArray(proj.ladder[ladder.fullKey]) ? proj.ladder[ladder.fullKey] : null;
      const items = fromLadder !== null ? fromLadder : fallback.filter((e) => String(e.ladder_level || "").toUpperCase().startsWith(ladder.key));
      if (!items.length) {
        sec.appendChild(el("div", "empty-inline", "暂无挂载条目"));
      } else {
        items.forEach((item) => {
          const row = el("div", "ladder-item");
          row.appendChild(el("div", "ladder-item-title", item.title || "未命名条目"));
          if (item.one_line_essence) row.appendChild(el("div", "ladder-item-text", item.one_line_essence));
          if (item.how_to_apply) row.appendChild(el("div", "ladder-item-text", "怎么用：" + item.how_to_apply));
          row.appendChild(makeCopyActions(item.one_line_essence || item.title, item.how_to_apply));
          sec.appendChild(row);
        });
      }
      card.appendChild(sec);
    });
    box.appendChild(card);
  });
}

function renderEntriesView() {
  const box = document.getElementById("content");
  box.innerHTML = "";
  const all = state.data.entries || [];
  const list = state.activeTab === "all" ? all : all.filter((e) => e.domain === state.activeTab);
  if (!list.length) { box.appendChild(el("div", "empty", "当前分类暂无条目。")); return; }
  list.forEach((entry) => box.appendChild(renderEntryCard(entry)));
}

function renderToolbar() {
  const d = state.data;
  const sync = d.last_sync_status || {};
  const clipOn = Boolean(d.clipboard_watcher && d.clipboard_watcher.running);
  const compOn = Boolean(d.live_companion && d.live_companion.running);
  document.getElementById("syncMeta").textContent = sync.message || (sync.running ? "同步中" : "就绪");
  const btnSync = document.getElementById("btnSync");
  btnSync.disabled = Boolean(sync.running);
  btnSync.textContent = sync.running ? "抓取中..." : "抓今日热点";
  const btnClip = document.getElementById("btnClipboard");
  btnClip.textContent = clipOn ? "剪贴板监测: 开" : "剪贴板监测: 关";
  btnClip.classList.toggle("btn-active", clipOn);
  const btnComp = document.getElementById("btnCompanion");
  btnComp.textContent = compOn ? "伴随同看: 开" : "伴随同看: 关";
  btnComp.classList.toggle("btn-active", compOn);
  document.querySelectorAll(".model-opt").forEach((b) => b.classList.toggle("is-selected", b.dataset.model === d.model));
}

function render() {
  renderToolbar();
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("is-active", t.dataset.tab === state.activeTab));
  if (state.activeTab === "projects") renderProjectsView(); else renderEntriesView();
}

async function refreshState() {
  try { state.data = await api("/api/state"); render(); } catch (err) { setNotice(err.message); }
}

document.getElementById("tabs").addEventListener("click", (ev) => {
  const btn = ev.target.closest(".tab");
  if (!btn) return;
  state.activeTab = btn.dataset.tab;
  render();
});

document.getElementById("btnSync").addEventListener("click", async () => {
  setNotice("已在后台启动热点抓取...");
  try { const r = await api("/api/sync-hotspots", { method: "POST" }); setNotice(r.message || "后台抓取已启动"); await refreshState(); }
  catch (err) { setNotice(err.message); }
});

document.getElementById("btnClipboard").addEventListener("click", async () => {
  try { const r = await api("/api/toggle-clipboard", { method: "POST" }); setNotice(r.running ? "已开启剪贴板监测" : "已关闭剪贴板监测"); await refreshState(); }
  catch (err) { setNotice(err.message); }
});

document.getElementById("btnCompanion").addEventListener("click", async () => {
  try { const r = await api("/api/toggle-companion", { method: "POST" }); setNotice(r.running ? "已开启伴随同看" : "已关闭伴随同看"); await refreshState(); }
  catch (err) { setNotice(err.message); }
});

document.querySelectorAll(".model-opt").forEach((btn) => {
  btn.addEventListener("click", async () => {
    const target = btn.dataset.model;
    try {
      const r = await api("/api/model", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: target }) });
      setNotice("默认模型已切换为 " + (r.model || target));
      await refreshState();
    } catch (err) { setNotice(err.message); }
  });
});

document.getElementById("btnCreateProject").addEventListener("click", async () => {
  const input = document.getElementById("quickInput");
  const raw = input.value.trim();
  if (!raw) { setNotice("请先输入项目名称"); return; }
  const sep = raw.includes("：") ? "：" : (raw.includes(":") ? ":" : "");
  const name = sep ? raw.split(sep)[0].trim() : raw;
  const ideaSummary = sep ? raw.slice(raw.indexOf(sep) + 1).trim() : raw;
  try {
    await api("/api/projects", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, idea_summary: ideaSummary }) });
    input.value = ""; state.activeTab = "projects"; setNotice("已新建项目：" + name); await refreshState();
  } catch (err) { setNotice(err.message); }
});

document.getElementById("btnCaptureUrl").addEventListener("click", async () => {
  const input = document.getElementById("quickInput");
  const raw = input.value.trim();
  if (!raw) { setNotice("请先输入链接或笔记内容"); return; }
  try {
    const r = await api("/api/capture-url", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ input: raw }) });
    input.value = ""; setNotice(r.message || "已提交后台拆解"); await refreshState();
  } catch (err) { setNotice(err.message); }
});

refreshState();
setInterval(() => { if (!document.hidden) refreshState(); }, 6000);
</script>
</body>
</html>
