[project]
name = "ai-hotspot-creator"
version = "0.1.0"
description = "Personal AI hotspot collector, analyzer, and Obsidian/NotebookLM exporter powered by Gemini."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "google-genai>=1.10.0",
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
